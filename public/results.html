<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Results</title>
<link rel="stylesheet" href="/style.css">

<div class="wrap">
  <h1>🏆 Live Scoreboard</h1>
  <p class="muted" id="sub">Updating every 2 seconds…</p>
  <div id="board"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const token = localStorage.getItem('vtoken') || '';

async function tick() {
  const r = await fetch('/api/admin/state', { headers: { Authorization: 'Bearer ' + token } });
  if (!r.ok) { $('#board').innerHTML = '<p class="err">Log in on the admin page first, then reopen this window.</p>'; return; }
  const s = await r.json();
  const list = [...s.candidates].sort((a, b) => b.votes - a.votes);
  const max = Math.max(1, ...list.map(c => c.votes));
  const total = list.reduce((n, c) => n + c.votes, 0);

  $('#sub').textContent = `${s.ballotCount} ballot(s) · ${total} vote(s) cast · voting ${s.settings.open ? 'OPEN' : 'CLOSED'}`;
  $('#board').innerHTML = list.map((c, i) => `
    <div class="card" style="margin-bottom:10px">
      <div class="row" style="flex-wrap:nowrap;gap:14px">
        <div style="font-size:22px;width:38px;text-align:center">${['🥇','🥈','🥉'][i] || (i + 1)}</div>
        ${c.photo
          ? `<img src="${c.photo}" style="width:52px;height:52px;object-fit:cover;border-radius:10px">`
          : `<div style="width:52px;height:52px;border-radius:10px;background:#0b0d13;display:grid;place-items:center">👤</div>`}
        <div style="flex:1;min-width:0">
          <div class="row" style="justify-content:space-between">
            <b>${c.name.replace(/</g, '&lt;')}</b>
            <span>${c.votes} <span class="muted">(${total ? Math.round(c.votes / total * 100) : 0}%)</span></span>
          </div>
          <div class="bar" style="margin-top:6px"><i style="width:${c.votes / max * 100}%"></i></div>
        </div>
      </div>
    </div>`).join('') || '<p class="muted">No candidates yet.</p>';
}
tick();
setInterval(tick, 2000);
</script>
