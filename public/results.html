<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Results</title>
<link rel="stylesheet" href="/style.css">

<div class="wrap">
  <div class="row" style="justify-content:space-between;align-items:flex-start">
    <div>
      <h1 id="head">🏆 Live Scoreboard</h1>
      <p class="muted" id="sub">Connecting…</p>
    </div>
    <span id="dot" class="muted" style="font-size:12px;white-space:nowrap">●</span>
  </div>
  <div id="board"></div>
</div>

<script src="/version.js"></script>
<script>
const $ = s => document.querySelector(s);

// Photos are large base64 strings, so they are fetched once and kept here; polls after
// the first ask only for names and vote counts.
const photos = new Map();
let lastPaint = '';

const POLL_MS = 1200;

async function tick(withPhotos = false) {
  let s;
  try {
    const r = await fetch('/api/results' + (withPhotos ? '?photos=1' : ''), { cache: 'no-store' });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Could not load results.');
    s = await r.json();
    // A projector board is unattended, so it refreshes itself without asking.
    if (buildWatch.changed(s.build)) return buildWatch.reload();
    $('#dot').textContent = '● live';
    $('#dot').style.color = 'var(--accent-2)';
  } catch (e) {
    $('#dot').textContent = '● reconnecting';
    $('#dot').style.color = '#ffb4b4';
    if (!lastPaint) $('#board').innerHTML = `<p class="err">${e.message}</p>`;
    return;
  }

  s.candidates.forEach(c => { if (c.photo !== undefined) photos.set(c.id, c.photo); });
  // A candidate added since the last full fetch has no cached photo yet.
  if (!withPhotos && s.candidates.some(c => !photos.has(c.id))) return tick(true);

  document.title = s.title + ' — Results';
  $('#head').textContent = '🏆 ' + s.title;

  const list = [...s.candidates].sort((a, b) => b.votes - a.votes || a.name.localeCompare(b.name));
  const max = Math.max(1, ...list.map(c => c.votes));
  const total = list.reduce((n, c) => n + c.votes, 0);

  // Skip the repaint when nothing changed, so the page does not flicker every poll.
  const fingerprint = s.title + '|' + s.open + '|' + list.map(c => c.id + ':' + c.votes).join(',');
  if (fingerprint === lastPaint) return;
  lastPaint = fingerprint;

  $('#sub').textContent =
    `${s.ballotCount} ballot(s) · ${total} vote(s) cast · voting ${s.open ? 'OPEN' : 'CLOSED'}`;

  $('#board').innerHTML = list.map((c, i) => {
    const photo = photos.get(c.id);
    return `
    <div class="card" style="margin-bottom:10px">
      <div class="row" style="flex-wrap:nowrap;gap:14px">
        <div style="font-size:22px;width:38px;text-align:center">${['🥇','🥈','🥉'][i] || (i + 1)}</div>
        ${photo
          ? `<img src="${photo}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:10px">`
          : `<div style="width:52px;height:52px;border-radius:10px;background:#0b0d13;display:grid;place-items:center">👤</div>`}
        <div style="flex:1;min-width:0">
          <div class="row" style="justify-content:space-between">
            <b>${c.name.replace(/</g, '&lt;')}</b>
            <span>${c.votes} <span class="muted">(${total ? Math.round(c.votes / total * 100) : 0}%)</span></span>
          </div>
          <div class="bar" style="margin-top:6px"><i style="width:${c.votes / max * 100}%;transition:width .4s ease"></i></div>
        </div>
      </div>
    </div>`;
  }).join('') || '<p class="muted">No candidates yet.</p>';
}

tick(true);
setInterval(() => tick(false), POLL_MS);
// A phone that was asleep or backgrounded should catch up the moment it is looked at.
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(false); });
</script>
