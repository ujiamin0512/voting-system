<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voting Admin</title>
<link rel="stylesheet" href="/style.css">

<div class="wrap">
  <!-- LOGIN -->
  <section id="login" class="card" style="max-width:360px;margin:80px auto">
    <h1>Admin login</h1>
    <p class="muted">Enter the admin password.</p>
    <div class="row">
      <input id="pw" type="password" placeholder="Password" style="flex:1">
      <button id="loginBtn">Enter</button>
    </div>
    <p id="loginErr" class="err"></p>
  </section>

  <!-- PANEL -->
  <section id="panel" hidden>
    <div id="newBuild" hidden style="background:#0f2b1a;border:1px solid #22c55e;color:#9df5c0;padding:12px 14px;border-radius:10px;margin-bottom:16px">
      <div class="row" style="justify-content:space-between">
        <span><b>↻ A newer version of this app is live.</b> Reload to use it.</span>
        <button onclick="buildWatch.reload()">Reload now</button>
      </div>
    </div>
    <div id="dbWarn" hidden style="background:#3a0f12;border:1px solid #7f1d1d;color:#ffc9c9;padding:12px 14px;border-radius:10px;margin-bottom:16px">
      <b>⚠ No database connected.</b>
      <div id="dbWarnText" style="margin-top:4px"></div>
    </div>
    <div class="row" style="justify-content:space-between">
      <div>
        <h1>Voting Admin</h1>
        <p class="muted" id="stat"></p>
      </div>
      <div class="row">
        <button class="ghost" id="previewBtn">Preview vote page</button>
        <button class="ghost" id="qrBtn">Vote QR</button>
        <button class="ghost" id="subQrBtn">Submit QR</button>
        <button class="ghost" id="resBtn">Projector</button>
        <button class="ghost" id="outBtn">Log out</button>
      </div>
    </div>

    <h2>Poll settings</h2>
    <div class="card row">
      <label>Title <input id="sTitle" style="width:240px"></label>
      <label>Votes each participant must cast <input id="sVotes" type="number" min="1" style="width:90px"></label>
      <label class="row" style="gap:6px"><input id="sOpen" type="checkbox"> Voting open</label>
      <label class="row" style="gap:6px"><input id="sLock" type="checkbox"> One vote per device</label>
      <label>Participants submit
        <select id="sMode">
          <option value="pictures">Pictures (name + photo)</option>
          <option value="links">Links (name + game + URL)</option>
        </select>
      </label>
      <label class="row" style="gap:6px"><input id="sSubs" type="checkbox"> Submissions open</label>
      <button id="saveSet">Save</button>
      <span id="setMsg" class="ok"></span>
    </div>

    <h2>Add candidate</h2>
    <div class="card row">
      <input id="cName" placeholder="Name" style="flex:1;min-width:180px">
      <input id="cGame" placeholder="Game name" style="flex:1;min-width:160px" hidden>
      <input id="cLink" placeholder="https://link-to-play" style="flex:2;min-width:220px" hidden>
      <input id="cPhoto" type="file" accept="image/*">
      <button id="addBtn">Add</button>
      <span id="addMsg" class="err"></span>
    </div>

    <h2>Candidates <span class="muted" id="count"></span></h2>
    <div class="card">
      <table>
        <thead id="head"></thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="row" style="margin-top:14px">
        <button class="ghost" id="unlockBtn">Clear device locks</button>
        <button class="danger" id="resetBtn">Reset all votes</button>
      </div>
    </div>
  </section>
</div>

<dialog id="prevDlg">
  <div class="row" style="justify-content:space-between;margin-bottom:12px">
    <h2 style="margin:0">Voter's view</h2>
    <div class="row">
      <button class="ghost" id="prevReload">Refresh</button>
      <button class="ghost" id="prevTab">Open in tab</button>
      <button class="ghost" onclick="prevDlg.close()">Close</button>
    </div>
  </div>
  <iframe id="prevFrame" title="Vote page preview"
          style="width:390px;height:660px;max-width:86vw;max-height:70vh;border:1px solid var(--line);border-radius:22px;background:var(--bg)"></iframe>
  <p class="muted" style="max-width:390px">Selections here are not recorded and won't use up your device's vote.</p>
</dialog>

<dialog id="qrDlg">
  <h2 style="margin-top:0" id="qrHead">Scan to vote</h2>
  <div id="qr" style="background:#fff;padding:14px;border-radius:10px;display:grid;place-items:center;min-height:240px"></div>
  <p class="muted" id="qrUrl" style="word-break:break-all"></p>
  <p class="muted" id="qrNote"></p>
  <button class="ghost" onclick="qrDlg.close()">Close</button>
</dialog>

<script src="/version.js"></script>
<script src="/img.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $ = s => document.querySelector(s);
let token = localStorage.getItem('vtoken') || '';
let voteUrl = '', submitUrl = '', mode = 'pictures';

const api = async (path, opts = {}) => {
  const r = await fetch(path, {
    ...opts,
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token, ...(opts.headers || {}) }
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || 'Request failed');
  return data;
};

// --- login ---
$('#loginBtn').onclick = async () => {
  try {
    const { token: t } = await api('/api/login', { method: 'POST', body: JSON.stringify({ password: $('#pw').value }) });
    token = t; localStorage.setItem('vtoken', t); show();
  } catch (e) { $('#loginErr').textContent = e.message; }
};
$('#pw').onkeydown = e => { if (e.key === 'Enter') $('#loginBtn').click(); };
$('#outBtn').onclick = () => { localStorage.removeItem('vtoken'); location.reload(); };

async function show() {
  try { await load(); } catch { return; }
  $('#login').hidden = true; $('#panel').hidden = false;
}

// --- load state ---
async function load() {
  const s = await api('/api/admin/state');
  // The admin may be mid-edit, so this offers a reload instead of forcing one.
  if (buildWatch.changed(s.build)) $('#newBuild').hidden = false;
  voteUrl = s.voteUrl; submitUrl = s.submitUrl;
  mode = s.settings.mode;
  const links = mode === 'links';
  $('#sTitle').value = s.settings.title;
  $('#sVotes').value = s.settings.votesPerVoter;
  $('#sOpen').checked = s.settings.open;
  $('#sLock').checked = s.settings.oneVotePerDevice;
  $('#sMode').value = mode;
  $('#sSubs').checked = s.settings.submissionsOpen;
  // The add form and the table follow the mode.
  $('#cGame').hidden = !links; $('#cLink').hidden = !links; $('#cPhoto').title = links ? 'Cover image (optional)' : 'Photo';
  $('#head').innerHTML = links
    ? '<tr><th>Name</th><th>Game</th><th>Link</th><th style="width:80px">Votes</th><th style="width:280px"></th></tr>'
    : '<tr><th style="width:64px">Photo</th><th>Name</th><th style="width:80px">Votes</th><th style="width:190px"></th></tr>';
  $('#count').textContent = `(${s.candidates.length})`;
  $('#stat').textContent = `${links ? 'Links' : 'Pictures'} mode · ${s.ballotCount} ballot(s) submitted · ${s.lockedDevices} device lock(s) · voting ${s.settings.open ? 'OPEN' : 'CLOSED'} · submissions ${s.settings.submissionsOpen ? 'OPEN' : 'CLOSED'} · storage: ${s.storage}`;
  const noDb = s.storage === 'none';
  $('#dbWarn').hidden = !noDb;
  if (noDb) {
    $('#dbWarnText').innerHTML =
      'Vercel cannot save data to files, so nothing can be added until a database is connected.<br>' +
      '<b>Storage → Create Database → Neon → Connect</b>, then <b>Deployments → Redeploy</b>. ' +
      'Diagnostics: <a href="/api/health" target="_blank" style="color:#ffc9c9">/api/health</a>';
  }
  $('#rows').innerHTML = '';
  s.candidates.forEach(c => $('#rows').append(rowFor(c)));
}

function rowFor(c) {
  const tr = document.createElement('tr');
  const badge = c.submitted ? '<span class="badge" title="Submitted by a participant">📱 phone</span>' : '';
  const q = v => String(v || '').replace(/"/g, '&quot;');
  if (mode === 'links') {
    tr.innerHTML = `<td><input value="${q(c.name)}" data-name style="width:100%">${badge}</td>
      <td><input value="${q(c.game)}" data-game style="width:100%"></td>
      <td><div class="row" style="flex-wrap:nowrap"><input value="${q(c.link)}" data-link style="flex:1;min-width:120px">
        ${c.link ? `<a href="${q(c.link)}" target="_blank" rel="noopener" style="color:var(--accent)" title="Open">↗</a>` : ''}</div></td>
      <td><input type="number" min="0" value="${c.votes}" data-votes style="width:70px"></td>
      <td class="row">
        <input type="file" accept="image/*" data-file style="width:104px" title="Cover image">
        <button data-save>Save</button>
        <button class="danger" data-del>Delete</button>
      </td>`;
    tr.querySelector('[data-save]').onclick = async () => {
      try {
        const body = {
          name: tr.querySelector('[data-name]').value, game: tr.querySelector('[data-game]').value,
          link: tr.querySelector('[data-link]').value, votes: +tr.querySelector('[data-votes]').value
        };
        const f = tr.querySelector('[data-file]').files[0];
        if (f) body.photo = await toDataUrl(f);
        await api('/api/candidates/' + c.id, { method: 'PUT', body: JSON.stringify(body) });
        load();
      } catch (e) { alert(e.message); }
    };
    tr.querySelector('[data-del]').onclick = async () => {
      if (!confirm(`Delete "${c.game || c.name}"?`)) return;
      await api('/api/candidates/' + c.id, { method: 'DELETE' });
      load();
    };
    return tr;
  }
  const img = c.photo
    ? `<img src="${c.photo}" style="width:48px;height:48px;object-fit:cover;border-radius:8px">`
    : `<div style="width:48px;height:48px;border-radius:8px;background:#0b0d13;display:grid;place-items:center">👤</div>`;
  tr.innerHTML = `<td>${img}</td>
    <td><input value="${c.name.replace(/"/g, '&quot;')}" data-name style="width:100%">${badge}</td>
    <td><input type="number" min="0" value="${c.votes}" data-votes style="width:70px"></td>
    <td class="row">
      <input type="file" accept="image/*" data-file style="width:104px">
      <button data-save>Save</button>
      <button class="danger" data-del>Delete</button>
    </td>`;
  tr.querySelector('[data-save]').onclick = async () => {
    const body = { name: tr.querySelector('[data-name]').value, votes: +tr.querySelector('[data-votes]').value };
    const f = tr.querySelector('[data-file]').files[0];
    if (f) body.photo = await toDataUrl(f);
    await api('/api/candidates/' + c.id, { method: 'PUT', body: JSON.stringify(body) });
    load();
  };
  tr.querySelector('[data-del]').onclick = async () => {
    if (!confirm(`Delete "${c.name}"?`)) return;
    await api('/api/candidates/' + c.id, { method: 'DELETE' });
    load();
  };
  return tr;
}

// --- actions ---
$('#saveSet').onclick = async () => {
  try {
    await api('/api/settings', { method: 'PUT', body: JSON.stringify({
      title: $('#sTitle').value, votesPerVoter: $('#sVotes').value,
      open: $('#sOpen').checked, oneVotePerDevice: $('#sLock').checked,
      mode: $('#sMode').value, submissionsOpen: $('#sSubs').checked
    })});
    $('#setMsg').textContent = 'Saved'; setTimeout(() => $('#setMsg').textContent = '', 1500);
    load();
  } catch (e) { alert(e.message); }
};

$('#addBtn').onclick = async () => {
  $('#addMsg').textContent = '';
  try {
    const body = { name: $('#cName').value };
    if (mode === 'links') { body.game = $('#cGame').value; body.link = $('#cLink').value; }
    const f = $('#cPhoto').files[0]; body.photo = f ? await toDataUrl(f) : '';
    await api('/api/candidates', { method: 'POST', body: JSON.stringify(body) });
    $('#cName').value = ''; $('#cPhoto').value = ''; $('#cGame').value = ''; $('#cLink').value = '';
    load();
  } catch (e) { $('#addMsg').textContent = e.message; }
};

$('#resetBtn').onclick = async () => {
  if (!confirm('Reset every candidate to 0 votes and clear all ballots?')) return;
  await api('/api/reset', { method: 'POST' });
  load();
};

$('#unlockBtn').onclick = async () => {
  if (!confirm('Allow every device to vote again? Existing vote counts are kept.')) return;
  await api('/api/unlock-devices', { method: 'POST' });
  load();
};

$('#resBtn').onclick = () => window.open('/projector', '_blank');

const PREVIEW_URL = '/vote?preview=1';
$('#previewBtn').onclick = () => { $('#prevFrame').src = PREVIEW_URL; prevDlg.showModal(); };
$('#prevReload').onclick = () => { $('#prevFrame').src = PREVIEW_URL + '&t=' + Date.now(); };
$('#prevTab').onclick = () => window.open(PREVIEW_URL, '_blank');

function showQr(head, url) {
  $('#qrHead').textContent = head;
  $('#qr').innerHTML = '';
  $('#qrUrl').textContent = url;
  // A public https link works from any network; a LAN address does not.
  $('#qrNote').textContent = /^https:/.test(url)
    ? 'Works on any network, including mobile data.'
    : 'Local address — participants must be on the same Wi-Fi. For a public link, open this admin page on your deployed site instead.';
  if (window.QRCode) new QRCode($('#qr'), { text: url, width: 240, height: 240 });
  else $('#qr').innerHTML = '<span style="color:#333">QR library offline — share the link below.</span>';
  qrDlg.showModal();
}
$('#qrBtn').onclick = () => showQr('Scan to vote', voteUrl);
$('#subQrBtn').onclick = () => showQr(mode === 'links' ? 'Scan to submit your game' : 'Scan to submit your photo', submitUrl);

// load() only runs after an action, so a quiet admin tab would not notice a deploy.
// /api/results is small and public, which makes it a cheap heartbeat.
setInterval(() => {
  fetch('/api/results', { cache: 'no-store' })
    .then(r => r.json())
    .then(d => { if (buildWatch.changed(d.build)) $('#newBuild').hidden = false; })
    .catch(() => {});
}, 30000);

if (token) show();
</script>
