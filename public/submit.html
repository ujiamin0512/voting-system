<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Submit</title>
<link rel="stylesheet" href="/style.css">
<style>
  .form { display: flex; flex-direction: column; gap: 14px; max-width: 460px; }
  .form label { display: flex; flex-direction: column; gap: 6px; font-weight: 600; }
  .form label[hidden] { display: none; }
  .form input { width: 100%; }
  .preview { width: 100%; max-width: 460px; aspect-ratio: 16/9; object-fit: cover; border-radius: 12px; background: #0b0d13; display: none; }

  /* ---- "You're in" confirmation screen ---- */
  .done {
    --ease: cubic-bezier(.32,.72,0,1);
    --hair: rgba(255,255,255,.08);
    min-height: 100dvh; background: #050507; color: #f4f5f8; overflow-x: hidden; position: relative;
    font-family: "Geist", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  /* Two soft orbs behind everything; fixed so they never repaint on scroll. */
  .done::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background:
      radial-gradient(40rem 30rem at 85% -10%, rgba(91,140,255,.22), transparent 60%),
      radial-gradient(34rem 28rem at -10% 110%, rgba(34,197,94,.14), transparent 60%);
  }
  .done .stage {
    position: relative; max-width: 1040px; margin: 0 auto; padding: 96px 32px 120px;
    display: grid; grid-template-columns: 1.05fr .95fr; gap: 72px; align-items: center;
  }
  .done .eyebrow {
    display: inline-flex; align-items: center; gap: 8px; border-radius: 99px; padding: 6px 12px;
    background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--hair);
    font-size: 10px; letter-spacing: .22em; text-transform: uppercase; font-weight: 500; color: #b9c0d0;
  }
  .done .eyebrow i { width: 6px; height: 6px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 12px #22c55e; }
  .done h1 {
    font-size: clamp(52px, 8vw, 104px); line-height: .92; letter-spacing: -.045em; font-weight: 600;
    margin: 26px 0 22px;
  }
  .done h1 em { font-style: normal; color: #7d8496; }
  .done .lede { font-size: 17px; line-height: 1.6; color: #9aa2b5; max-width: 30ch; margin: 0 0 40px; }
  .done .lede b { color: #f4f5f8; font-weight: 500; }

  /* Status capsule: voting open vs. not yet open. */
  .done .status {
    display: flex; gap: 14px; align-items: flex-start; padding: 16px 18px; border-radius: 20px; max-width: 420px;
    background: rgba(255,255,255,.025); box-shadow: inset 0 0 0 1px var(--hair); margin-bottom: 36px;
  }
  .done .status .dot { flex: none; margin-top: 7px; width: 8px; height: 8px; border-radius: 50%; background: #f5b74a; box-shadow: 0 0 14px #f5b74a; }
  .done .status.live .dot { background: #22c55e; box-shadow: 0 0 14px #22c55e; }
  .done .status b { display: block; font-weight: 500; font-size: 15px; }
  .done .status span { color: #8a91a3; font-size: 14px; }

  .done .ctas { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .done .pill {
    display: inline-flex; align-items: center; gap: 14px; padding: 8px 8px 8px 24px; border-radius: 99px;
    text-decoration: none; font-weight: 500; font-size: 15px; color: #050507; background: #f4f5f8;
    transition: transform .6s var(--ease), background .6s var(--ease);
  }
  .done .pill:active { transform: scale(.98); }
  .done .pill .ic {
    width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center;
    background: rgba(5,5,7,.08); transition: transform .6s var(--ease);
  }
  .done .pill:hover .ic { transform: translate(3px,-1px) scale(1.06); }
  .done .pill.ghost { color: #f4f5f8; background: rgba(255,255,255,.04); box-shadow: inset 0 0 0 1px var(--hair); }
  .done .pill.ghost .ic { background: rgba(255,255,255,.08); }
  .done .pill.ghost:hover { background: rgba(255,255,255,.08); }
  .done .quiet { margin-top: 28px; font-size: 14px; color: #6f7687; }
  .done .quiet a { color: #b9c0d0; text-decoration: none; box-shadow: 0 1px 0 rgba(185,192,208,.3); }
  .done svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.4; fill: none; }

  /* The entry itself: a machined double-bezel card, tilted a touch. */
  .done .shell {
    padding: 8px; border-radius: 36px; background: rgba(255,255,255,.03);
    box-shadow: inset 0 0 0 1px var(--hair), 0 40px 120px -40px rgba(91,140,255,.35);
    transform: rotate(2deg); transition: transform 1s var(--ease);
  }
  .done .shell:hover { transform: rotate(0deg) translateY(-4px); }
  .done .core {
    border-radius: 28px; overflow: hidden; background: linear-gradient(180deg,#12141c,#0b0c12);
    box-shadow: inset 0 1px 1px rgba(255,255,255,.12);
  }
  .done .core .cover { border-radius: 0; box-shadow: none; font-size: 14px; }
  .done .core .cover.gen .big, .done .core .cover .cap { display: none; } /* title is in .meta below */
  .done .core .shot { width: 100%; aspect-ratio: 1/1; object-fit: cover; display: block; }
  .done .meta { padding: 22px 24px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .done .meta .t { font-size: 22px; font-weight: 600; letter-spacing: -.02em; line-height: 1.2; overflow-wrap: anywhere; }
  .done .meta .by { color: #7d8496; font-size: 14px; margin-top: 2px; }
  .done .meta .pill { flex: none; padding: 6px 6px 6px 18px; font-size: 14px; }
  .done .meta .pill .ic { width: 30px; height: 30px; }

  /* Entry choreography: heavy fade-up, staggered. */
  .done .rise { opacity: 0; transform: translateY(40px); filter: blur(8px); animation: rise 1s var(--ease) forwards; }
  .done .rise.d1 { animation-delay: .08s } .done .rise.d2 { animation-delay: .16s }
  .done .rise.d3 { animation-delay: .24s } .done .rise.d4 { animation-delay: .32s } .done .rise.d5 { animation-delay: .4s }
  @keyframes rise { to { opacity: 1; transform: none; filter: blur(0); } }
  @media (prefers-reduced-motion: reduce) { .done .rise { animation: none; opacity: 1; transform: none; filter: none; } }

  @media (max-width: 767px) {
    .done .stage { grid-template-columns: 1fr; gap: 48px; padding: 56px 16px 80px; }
    .done .art { order: -1; }
    .done .shell, .done .shell:hover { transform: none; }
    .done .lede { max-width: none; }
    .done .ctas .pill { flex: 1 1 100%; justify-content: space-between; }
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&display=swap">

<div class="wrap">
  <h1 id="title">Loading…</h1>
  <p class="muted" id="rule"></p>

  <form class="form card" id="form" hidden>
    <label>Your name <input id="fName" maxlength="60" required autocomplete="name"></label>
    <label id="lGame" hidden>Game name <input id="fGame" maxlength="80"></label>
    <label id="lLink" hidden>Link to play <input id="fLink" type="url" inputmode="url" placeholder="https://…"></label>
    <label id="lPhoto" hidden><span id="lPhotoTxt">Photo</span> <input id="fPhoto" type="file" accept="image/*"></label>
    <img class="preview" id="preview" alt="">
    <button id="submit">Submit</button>
    <p id="msg" class="err" style="margin:0"></p>
  </form>
</div>

<script src="/version.js"></script>
<script src="/img.js"></script>
<script src="/cover.js"></script>
<script>
const $ = s => document.querySelector(s);
let mode = 'pictures', deviceId = '', mine = null, photo = '', votingOpen = false;

// Same device id the vote page uses, so "one entry per device" and "one vote per
// device" refer to the same phone.
const store = {
  get: () => { try { return localStorage.getItem('vdid') || ''; } catch { return ''; } },
  set: v => { try { localStorage.setItem('vdid', v); } catch {} }
};

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
const ARROW = '<svg viewBox="0 0 16 16"><path d="M4.5 11.5l7-7M5.5 4.5h6v6"/></svg>';
const PLAY = '<svg viewBox="0 0 16 16"><path d="M5 3.5v9l7.5-4.5z"/></svg>';

// Confirmation screen. No QR here: everyone reaches the game from the library on /vote.
function done(d, updated) {
  const links = mode === 'links';
  const title = links ? (d.game || d.name) : d.name;
  const art = links
    ? coverTile(d)
    : (d.photo ? `<img class="shot" src="${esc(d.photo)}" alt="">` : '');
  const play = links && d.link
    ? `<a class="pill" href="${esc(d.link)}" target="_blank" rel="noopener">Play<span class="ic">${PLAY}</span></a>` : '';
  const status = votingOpen
    ? `<div class="status live rise d3"><i class="dot"></i><div><b>Voting is open</b>
         <span>Go pick your favourites before it closes.</span></div></div>`
    : `<div class="status rise d3"><i class="dot"></i><div><b>Voting hasn't opened yet</b>
         <span>Explore and play the other ${links ? 'games' : 'entries'} meanwhile. Voting unlocks when the host opens it.</span></div></div>`;
  document.body.className = 'done';
  document.body.innerHTML =
    `<main class="stage">
       <section>
         <span class="eyebrow rise"><i></i>${updated ? 'Entry updated' : 'Entry received'}</span>
         <h1 class="rise d1">You're in.<br><em>On the board.</em></h1>
         <p class="lede rise d2"><b>${esc(title)}</b>${links ? ` by ${esc(d.name)}` : ''} is now live in the library for everyone to see.</p>
         ${status}
         <div class="ctas rise d4">
           <a class="pill" href="/vote">${votingOpen ? 'Explore &amp; vote' : 'Explore ' + (links ? 'games' : 'entries')}<span class="ic">${ARROW}</span></a>
           <a class="pill ghost" href="/projector">Projector<span class="ic">${ARROW}</span></a>
         </div>
         <p class="quiet rise d5">Need to fix something? <a href="/submit">Edit my entry</a></p>
       </section>
       <aside class="art rise d2">
         <div class="shell"><div class="core">
           ${art}
           <div class="meta">
             <div><div class="t">${esc(title)}</div>${links ? `<div class="by">by ${esc(d.name)}</div>` : ''}</div>
             ${play}
           </div>
         </div></div>
       </aside>
     </main>`;
  scrollTo(0, 0);
}

async function load() {
  const r = await fetch('/api/poll?did=' + encodeURIComponent(store.get()), { cache: 'no-store' });
  const data = await r.json();
  if (buildWatch.changed(data.build)) return buildWatch.reload();
  const { settings, deviceId: did } = data;
  deviceId = did;
  if (did && !store.get()) store.set(did);
  mode = settings.mode;
  mine = data.mine;
  votingOpen = settings.open;
  document.title = 'Submit — ' + settings.title;
  $('#title').textContent = settings.title;

  if (!settings.submissionsOpen) {
    $('#rule').innerHTML = '<b class="err">Submissions are closed.</b> <a href="/vote" style="color:var(--accent)">Explore the entries →</a>';
    return;
  }
  const links = mode === 'links';
  $('#rule').textContent = links
    ? 'Enter your name, your game and the link to play it. A cover image makes it stand out in the library.'
    : 'Enter your name and pick a photo to enter.';
  $('#lGame').hidden = !links;
  $('#lLink').hidden = !links;
  $('#lPhoto').hidden = false;
  $('#lPhotoTxt').textContent = links ? 'Cover image (optional)' : 'Photo';
  $('#fGame').required = links;
  $('#fLink').required = links;
  $('#fPhoto').required = !links && !mine;

  if (mine) {
    $('#fName').value = mine.name;
    $('#fGame').value = mine.game || '';
    $('#fLink').value = mine.link || '';
    if (mine.photo) { $('#preview').src = mine.photo; $('#preview').style.display = 'block'; }
    $('#submit').textContent = 'Update my entry';
    $('#rule').textContent += ' You already have an entry — you can change it here.';
  }
  $('#form').hidden = false;
}

$('#fPhoto').onchange = async () => {
  const f = $('#fPhoto').files[0];
  if (!f) return;
  photo = await toDataUrl(f);
  $('#preview').src = photo; $('#preview').style.display = 'block';
};

$('#form').onsubmit = async e => {
  e.preventDefault();
  $('#submit').disabled = true; $('#msg').textContent = '';
  const body = { name: $('#fName').value, deviceId: store.get() || deviceId };
  if (mode === 'links') { body.game = $('#fGame').value; body.link = $('#fLink').value; }
  body.photo = photo || (mine && mine.photo) || '';
  const r = await fetch('/api/submit', {
    method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
  });
  const d = await r.json();
  if (!r.ok) { $('#msg').textContent = d.error; $('#submit').disabled = false; return; }
  store.set(store.get() || deviceId);
  done(d, r.status === 200);
};

load();
</script>
