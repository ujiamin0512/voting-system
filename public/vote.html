<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vote</title>
<link rel="stylesheet" href="/style.css">

<div class="wrap">
  <h1 id="title">Loading…</h1>
  <p class="muted" id="rule"></p>
  <div class="grid" id="grid"></div>

  <div class="sticky row" style="justify-content:space-between">
    <span id="counter" class="muted"></span>
    <button id="submit" disabled>Submit vote</button>
  </div>
  <p id="msg" class="err"></p>
</div>

<script src="/version.js"></script>
<script src="/cover.js"></script>
<script>
const $ = s => document.querySelector(s);
let need = 1, picked = new Set(), deviceId = '';
// Preview mode: admin-only rehearsal of the ballot. Nothing is recorded and the
// device is never locked, so the admin can look without spending their own vote.
const PREVIEW = new URLSearchParams(location.search).has('preview');

const store = {
  get: () => { try { return localStorage.getItem('vdid') || ''; } catch { return ''; } },
  set: v => { try { localStorage.setItem('vdid', v); } catch {} }
};

const done = (icon, head, sub) => {
  document.body.innerHTML =
    `<div class="wrap" style="text-align:center;padding-top:90px">
       <div style="font-size:64px">${icon}</div>
       <h1>${head}</h1>
       <p class="muted">${sub}</p>
     </div>`;
};

async function load() {
  const r = await fetch('/api/poll?did=' + encodeURIComponent(store.get()));
  const data = await r.json();
  // Reload only when the voter has not started choosing, so a refresh never
  // discards selections they are part-way through making.
  if (buildWatch.changed(data.build) && !picked.size) return buildWatch.reload();
  const { settings, candidates, deviceId: did, alreadyVoted } = data;
  deviceId = did;
  if (did && !store.get()) store.set(did);
  need = settings.votesPerVoter;
  $('#title').textContent = settings.title;

  if (PREVIEW) {
    document.body.insertAdjacentHTML('afterbegin',
      `<div style="background:#3b2f00;color:#ffd76e;padding:8px 16px;text-align:center;font-weight:600">
         👁 Preview — nothing you do here is recorded${settings.open ? '' : ' (voting is currently CLOSED for real voters)'}
       </div>`);
  } else {
    if (alreadyVoted) return done('🔒', 'Already voted', 'This device has already submitted a ballot.');
  }

  if (!settings.open && !PREVIEW) {
    $('#rule').innerHTML = '<b class="err">Voting is currently closed.</b>';
    $('#submit').remove();
    return;
  }
  $('#rule').textContent = `Select exactly ${need} ${need === 1 ? 'choice' : 'choices'}, then submit.`;

  const links = settings.mode === 'links';
  if (links) $('#rule').insertAdjacentHTML('afterend',
    '<p class="muted" style="margin-top:-8px">🎮 Game library — tap ▶ Play to try a game, tap the card to pick it. Submitted one? <a href="/submit" style="color:var(--accent)">Edit it</a>.</p>');

  $('#grid').innerHTML = '';
  candidates.forEach(c => {
    const el = document.createElement('div');
    el.className = 'cand pick';
    if (links) {
      // Game name is the headline, the creator underneath, and a Play link that
      // opens the game without toggling the selection.
      el.innerHTML = coverTile(c) +
        `<div class="body"><b></b><div class="muted by"></div>
        <a class="play" target="_blank" rel="noopener">▶ Play</a></div>`;
      el.querySelector('b').textContent = c.game || c.name;
      el.querySelector('.by').textContent = 'by ' + c.name;
      const a = el.querySelector('.play');
      if (c.link) { a.href = c.link; a.onclick = e => e.stopPropagation(); } else a.remove();
    } else {
      el.innerHTML = (c.photo ? `<img src="${c.photo}" alt="">` : `<div class="ph">👤</div>`) +
                     `<div class="body"><b></b></div>`;
      el.querySelector('b').textContent = c.name;
    }
    el.onclick = () => {
      if (picked.has(c.id)) picked.delete(c.id);
      else if (picked.size >= need) return flash(`You can only pick ${need}. Tap a selected one to remove it.`);
      else picked.add(c.id);
      el.classList.toggle('sel', picked.has(c.id));
      sync();
    };
    $('#grid').append(el);
  });
  sync();
}

function sync() {
  $('#counter').textContent = `${picked.size} of ${need} selected`;
  $('#submit').disabled = picked.size !== need;
}
const flash = m => { $('#msg').textContent = m; setTimeout(() => $('#msg').textContent = '', 2200); };

$('#submit').onclick = async () => {
  $('#submit').disabled = true;
  if (PREVIEW) return done('👁', 'Preview only', 'A real voter would be recorded here. Nothing was saved.');
  const r = await fetch('/api/vote', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ choices: [...picked], deviceId: store.get() || deviceId })
  });
  const d = await r.json();
  if (r.status === 409) return done('🔒', 'Already voted', d.error);
  if (!r.ok) { flash(d.error); $('#submit').disabled = false; return; }
  store.set(store.get() || deviceId);
  done('✅', 'Thank you!',
    'Your vote has been recorded.<br><a href="/projector" style="color:var(--accent)">See the live results →</a>');
};

load();

// A phone left on this page for hours would keep running the build it loaded with.
// Re-check whenever the voter comes back to the tab.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && !picked.size && !PREVIEW) {
    fetch('/api/poll?did=' + encodeURIComponent(store.get()), { cache: 'no-store' })
      .then(r => r.json())
      .then(d => { if (buildWatch.changed(d.build)) buildWatch.reload(); })
      .catch(() => {});
  }
});
</script>
